<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>טריוויה חכמה ודינמית</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🧠 טריוויה חכמה ודינמית</h1>
    <p class="subtitle">ללא מודל כבד • מהיר ויציב באייפון ובמחשב ישן • תכנון מהלכים ונקודות</p>
    <div id="status-pill" class="status-pill">⚡ מנוע מקומי דינמי מוכן (0MB הורדה)</div>
  </header>

  <main class="container">
    <!-- לוח ניקוד ואסטרטגיה -->
    <section class="card stats-grid" aria-label="נתוני משחק">
      <div class="stat-item">
        <span class="stat-label">ניקוד</span>
        <strong id="score-val" class="stat-value">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">מכפיל רצף</span>
        <strong id="streak-val" class="stat-value">x1.0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">התקדמות</span>
        <strong id="progress-val" class="stat-value">0 / 10</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">שיא אישי</span>
        <strong id="best-val" class="stat-value">0</strong>
      </div>
    </section>

    <!-- תכנון מהלך: בחירת נושא ורמת קושי -->
    <section class="card controls-card">
      <div class="controls-row">
        <div class="control-group">
          <label for="topic-select">נושא</label>
          <select id="topic-select">
            <option value="all">הכל מעורבב (דינמי)</option>
            <option value="מדע וטבע">מדע וטבע</option>
            <option value="היסטוריה וישראל">היסטוריה וישראל</option>
            <option value="טכנולוגיה ומחשבים">טכנולוגיה ומחשבים</option>
            <option value="גיאוגרפיה ועולם">גיאוגרפיה ועולם</option>
            <option value="לוגיקה ומספרים">לוגיקה ומספרים</option>
          </select>
        </div>

        <div class="control-group">
          <label for="difficulty-select">רמת סיכון</label>
          <select id="difficulty-select">
            <option value="easy">קלה (50 נק')</option>
            <option value="medium" selected>בינונית (100 נק')</option>
            <option value="hard">קשה (200 נק')</option>
          </select>
        </div>

        <button id="next-btn" class="btn btn-primary">שאלה חדשה 🎲</button>
      </div>
    </section>

    <!-- כרטיס שאלה -->
    <section class="card question-card">
      <div class="question-meta">
        <span id="q-topic-badge" class="badge">מוכן להתחלה</span>
        <span id="q-points-badge" class="badge badge-accent">+100 נקודות</span>
      </div>

      <h2 id="question-text" class="question-text">לחץ על "שאלה חדשה" כדי להתחיל סיבוב של 10 שאלות!</h2>

      <div class="answer-form">
        <input
          type="text"
          id="answer-input"
          class="answer-input"
          placeholder="הקלד תשובה חופשית..."
          autocomplete="off"
          disabled
        />
        <button id="submit-btn" class="btn btn-success" disabled>בדוק תשובה ✓</button>
      </div>

      <div id="hint-box" class="alert alert-hint hidden"></div>
      <div id="feedback-box" class="alert hidden"></div>

      <div class="card-footer">
        <button id="hint-btn" class="btn btn-outline-warning" disabled>קנה רמז (-25 נק')</button>
        <button id="skip-btn" class="btn btn-outline" disabled>דלג שאלה (-15 נק')</button>
        <button id="reset-btn" class="btn btn-outline-danger">איפוס משחק ↺</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
